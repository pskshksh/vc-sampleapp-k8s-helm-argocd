# Web UI for the local registry (joxit/docker-registry-ui). It runs an nginx that
# proxies the registry's /v2/ API (SINGLE_REGISTRY + NGINX_PROXY_PASS_URL), so the
# browser talks only to the UI origin — no CORS config on the registry needed.
# Reach it at http://127.0.0.1:30083 (NodePort via the Lima forward).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ui
  namespace: registry
  labels:
    app: registry-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-ui
  template:
    metadata:
      labels:
        app: registry-ui
    spec:
      containers:
        - name: ui
          image: joxit/docker-registry-ui:2.5.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: SINGLE_REGISTRY
              value: "true"
            - name: REGISTRY_TITLE
              value: "vc-sampleapp — docker-local"
            - name: NGINX_PROXY_PASS_URL
              value: "http://registry:5000"
            - name: SHOW_CONTENT_DIGEST
              value: "true"
            - name: SHOW_CATALOG_NB_TAGS
              value: "true"
            - name: CATALOG_MIN_BRANCHES
              value: "1"
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: registry-ui
  namespace: registry
spec:
  type: NodePort
  selector:
    app: registry-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30083      # browser: http://127.0.0.1:30083
