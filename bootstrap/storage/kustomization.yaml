apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Storage prerequisite: local-path-provisioner (vendored, pinned v0.0.30) with
# its StorageClass marked cluster-default. Both the registry and the app need a
# default StorageClass for their PVCs to bind. Applied by `make storage`.

resources:
  - local-path-provisioner.yaml

patches:
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
