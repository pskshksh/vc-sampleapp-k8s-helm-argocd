replicaCount: 2
image:
  repository: ghcr.io/pskshksh/webapp
  digest: "sha256:REPLACE_ME"
  tag: ""
  pullPolicy: IfNotPresent
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: js
networkPolicy:
  ingressFrom:                    # allow the ingress controller in stage
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # if using cert-manager
  hosts:
    - host: vc-sampleapp.stage.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [vc-sampleapp.stage.example.com]
      secretName: js-tls
