# EXAMPLE — the plaintext Secret manifest for stage. Use a STRONG password and
# keep the same password inside DATABASE_URL. Encrypt before committing.
apiVersion: v1
kind: Secret
metadata:
  name: vc-sampleapp-db
  namespace: vc-sampleapp
type: Opaque
stringData:
  password: CHANGE_ME_STRONG
  DATABASE_URL: postgres://rscounter:CHANGE_ME_STRONG@postgres:5432/rscounter
