# EXAMPLE — the plaintext Secret manifest for local.
# 1. copy to db.secret.yaml (gitignored)   cp db.secret.example.yaml db.secret.yaml
# 2. edit values if needed
# 3. encrypt with the master key:          scripts/secrets-encrypt.sh envs/local/secrets/db.secret.yaml
#    -> produces db.secret.yaml.enc (safe to commit)
# 4. apply:                                scripts/secrets-apply.sh envs/local/secrets/db.secret.yaml.enc
apiVersion: v1
kind: Secret
metadata:
  name: vc-sampleapp-db
  namespace: vc-sampleapp
type: Opaque
stringData:
  password: rscounter
  DATABASE_URL: postgres://rscounter:rscounter@postgres:5432/rscounter
